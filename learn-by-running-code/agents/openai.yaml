interface:
  display_name: "Learn by Running Code"
  short_description: "先分清学知识还是做项目，澄清需求后边做边学，推进到验证交付"
  default_prompt: "Use $learn-by-running-code to first distinguish knowledge learning from project delivery. If intent is unclear, ask before choosing. For learning, confirm a progressive curriculum and generate independently runnable Python/uv chapters with an AGENTS.md tutor guide. For a project, clarify the goal, domain, data, existing code, budget, resources, collaboration style and acceptance across focused rounds; inspect user-provided local materials, or research credible options when needs are vague. Confirm the concrete project plan before implementation. Preserve the existing stack and work incrementally in one real codebase, teaching only the knowledge needed for each milestone. Maintain PROJECT.md, AGENTS.md, PROGRESS.md and README.md, validate real outcomes, and continue according to the agreed collaboration mode until acceptance or a clearly reported blocker. Never equate a scaffold, mock, or structural check with a completed project."

name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate collection and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Validate Skill structure
        run: node scripts/validate-skills.mjs

      - name: Build DSH bundle
        run: node integrations/deepseek-harness/scripts/pack.mjs

      - name: Inspect npm package
        working-directory: integrations/deepseek-harness
        run: npm pack --dry-run --ignore-scripts
